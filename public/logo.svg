<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- xdraft wordmark. 原版 mydraft logo 文字已矢量化无法改字, 更名后用文字版重绘;
     配色沿用原版的 #fda100, 尺寸沿用原 viewBox 比例 (179x50)。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="179" height="50" viewBox="0 0 179 50" version="1.1" aria-label="xdraft">
  <text x="0" y="39"
        font-family="Nunito, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"
        font-size="46" font-weight="800" letter-spacing="-1.5"
        fill="#fda100">xdraft</text>
</svg>
